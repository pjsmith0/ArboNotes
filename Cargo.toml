[package]
name = "arbonotes"
version = "1.0.0"
edition = "2021"
rust-version = "1.90"
description = "A hierarchical note-taking application with a rich text editor and calendar"
license = "Apache-2.0"
repository = "https://github.com/pjs/ArboNotes"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
regex = "1"
unicode-normalization = "0.1"
dirs = "6"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
