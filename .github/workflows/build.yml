name: Build JavaFX Uber Jar

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      # No os-maven-plugin / classifier needed — org.openjfx's own parent
      # POM uses Maven's built-in OS-family profile activation, so a plain
      # `mvn package` on each runner resolves that runner's native JavaFX
      # libs automatically.
      - name: Build uber jar
        run: mvn -B clean package

      - name: Stage uber jar
        shell: bash
        run: |
          mkdir -p dist
          cp target/ArboNotes-*-all.jar dist/ArboNotes-${{ matrix.platform }}.jar

      - name: Upload uber jar
        uses: actions/upload-artifact@v4
        with:
          name: ArboNotes-${{ matrix.platform }}
          path: dist/ArboNotes-${{ matrix.platform }}.jar
          if-no-files-found: error
