# .github/workflows/build.yaml
name: Build JavaFX Uber Jar

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      # os-maven-plugin auto-detects the classifier (win/linux/mac) for
      # this runner, so javafx-maven-plugin pulls the matching native
      # JavaFX libs and shade/assembly bundles them into the uber jar.
      - name: Build uber jar
        run: mvn -B clean package

      - name: Rename uber jar for clarity
        shell: bash
        run: |
          mkdir -p dist
          # adjust this glob if your shade/assembly plugin uses a
          # different finalName / suffix (e.g. *-shaded.jar, *-all.jar)
          find target -maxdepth 1 -name '*.jar' ! -name 'original-*.jar' \
            -exec cp {} dist/app-${{ matrix.platform }}.jar \;

      - name: Upload uber jar
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform }}
          path: dist/app-${{ matrix.platform }}.jar
          if-no-files-found: error